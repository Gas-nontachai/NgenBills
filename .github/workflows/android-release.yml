name: Android APK Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release version from tag and validate build number
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_OFFSET: ${{ vars.ANDROID_BUILD_NUMBER_OFFSET || '1' }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 tool/android_release.py metadata
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          python3 tool/android_release.py keystore
          flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
      - name: Verify and package APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ngenbills-$RELEASE_VERSION.apk"
          cd dist
          sha256sum "ngenbills-$RELEASE_VERSION.apk" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG (build $RELEASE_BUILD)" --generate-notes
